name: android build

on:
  workflow_call:
  workflow_dispatch:

env:
  MUSL_BUILDER_VERSION: "1.0"
  BUILD_ARCHS: "arm64 armv7 x86_64 x86"
  BUILD_TYPES: ${{ (github.ref_name == 'develop') && 'release debug' || 'release' }}
  BUILD_TESTING: ${{ (github.ref_name != 'main') && 'testing' || '' }}

jobs:
  prepare-build-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      archs: ${{ steps.matrix-vars.outputs.ARCHS }}
      types: ${{ steps.matrix-vars.outputs.TYPES }}
      build_date: ${{ steps.matrix-vars.outputs.BUILD_DATE }}
      musl_builder_version: ${{ env.MUSL_BUILDER_VERSION }}
    steps:

    - name: Calculate matrix variables
      id: matrix-vars
      run: |
        echo ARCHS=[\"$BUILD_ARCHS\"] | sed 's| |","|g' >> "$GITHUB_OUTPUT"
        echo TYPES=[\"$BUILD_TYPES\"] | sed 's| |","|g' >> "$GITHUB_OUTPUT"
        echo "BUILD_DATE=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

  build-bin:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [prepare-build-matrix]
    container:
      image: ghcr.io/nzbgetcom/nzbget-musl-builder:android-${{ needs.prepare-build-matrix.outputs.musl_builder_version }}
    env:
      BUILD_DATE: ${{ needs.prepare-build-matrix.outputs.build_date }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare-build-matrix.outputs.archs) }}
        type: ${{ fromJSON(needs.prepare-build-matrix.outputs.types) }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Cache FetchContent dependencies
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/build/ci-android${{ matrix.type == 'debug' && '-debug' || '' }}-${{ matrix.arch }}/deps
        # Exact match only: restore-keys is intentionally omitted to avoid restoring
        # stale compiled binaries when toolchains, flags, or dependency configurations change.
        key: deps-android-${{ matrix.arch }}-${{ matrix.type }}-llvm19.1.7-api21-${{ hashFiles('cmake/*.cmake', 'CMakeLists.txt', 'CMakePresets.json', 'toolchains/android/android-llvm.cmake', 'toolchains/android/build-toolchain.sh') }}

    - name: Build & Package ${{ matrix.arch }} / ${{ matrix.type }}
      run: |
        bash platforms/android/build.sh bin ${{ matrix.arch }} ${{ matrix.type }} ${{ env.BUILD_TESTING }}

    - name: Upload full build log on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-android-${{ matrix.arch }}-${{ matrix.type }}-build-log
        path: build/ci-android${{ matrix.type == 'debug' && '-debug' || '' }}-${{ matrix.arch }}/*.log
        retention-days: 5

    - name: Upload architecture artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nzbget-android-bin-${{ matrix.arch }}-${{ matrix.type }}
        path: build/dist/*.tar.gz
        retention-days: 5

  build-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [prepare-build-matrix, build-bin]
    env:
      BUILD_DATE: ${{ needs.prepare-build-matrix.outputs.build_date }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: nzbget-android-bin-*
        path: artifacts

    - name: Build installer
      run: |
        mkdir -p build/dist
        find artifacts -name "*.tar.gz" -exec cp {} build/dist/ \;
        for TYPE in ${{ env.BUILD_TYPES }}; do
          bash platforms/android/build.sh installer all-arch $TYPE ${{ env.BUILD_TESTING }}
        done

    - name: Rename build artifacts
      if: github.ref_name != 'main' && github.ref_name != 'develop'
      run: |
        cd build/dist
        SUFFIX="-${GITHUB_REF_NAME/\//-}-bin-android"
        for FILE in *.run; do
          [ -f "$FILE" ] || continue
          mv "$FILE" "${FILE/-bin-android/$SUFFIX}"
        done

    - name: Delete unneeded platform-specific artifacts
      uses: geekyeggo/delete-artifact@v6
      with:
        name: nzbget-android-bin-*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nzbget-android-installers
        path: build/dist/*.run
        retention-days: 5
