name: tests

on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
    - main
  workflow_call:
  workflow_dispatch:

jobs:

  tests-windows:
    runs-on: windows-2022
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Prepare build environment
      run: |
        $ProgressPreference = "SilentlyContinue"
        Invoke-WebRequest https://github.com/nzbgetcom/build-files/releases/download/v10.0/nzbget-windows-tools.zip -OutFile "${{ github.workspace }}\tools.zip"
        Expand-Archive -Path "${{ github.workspace }}\tools.zip" -DestinationPath C:\
        Copy-Item "C:\nzbget\image\64\unrar.exe" -Destination "C:\Windows\System32"
        Copy-Item "C:\nzbget\image\64\7za.exe" -Destination "C:\Windows\System32\7z.exe"

    - name: Cache ExternalProject dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/debug-tests/deps
        key: deps-windows-test-${{ hashFiles('cmake/openssl.cmake', 'cmake/zlib.cmake', 'cmake/libxml2.cmake', 'cmake/boost.cmake', 'CMakeLists.txt') }}
        restore-keys: |
          deps-windows-test-

    - name: Build and Test
      shell: cmd
      run: |
        choco install nasm jom --no-progress
        set PATH=%PATH%;C:\Program Files\NASM;C:\ProgramData\chocolatey\bin
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cmake --preset=debug-tests
        cmake --build --preset=debug-tests
        ctest --preset=debug-tests

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-windows-test-log
        path: build/debug-tests/Testing/Temporary/LastTest.log
        retention-days: 5

  tests-linux:
    runs-on: ubuntu-24.04
    steps:

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libxml2-dev libssl-dev libncurses-dev libboost-all-dev unrar 7zip

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_ONLY_TESTS=ON
        cmake --build . --config Release -j 4

    - name: Test
      run: |
        cd build
        ctest -C Release

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-linux-test-log
        path: build/Testing/Temporary/LastTest.log
        retention-days: 5

  tests-linux-disabled-parcheck:
    runs-on: ubuntu-24.04
    steps:

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libxml2-dev libssl-dev libncurses-dev libboost-all-dev unrar 7zip

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_ONLY_TESTS=ON -DDISABLE_PARCHECK=yes
        cmake --build . --config Release -j 4

    - name: Test
      run: |
        cd build
        ctest -C Release

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-linux-test-log
        path: build/Testing/Temporary/LastTest.log
        retention-days: 5

  tests-macos:
    runs-on: macos-latest
    steps:

    - name: Install dependencies
      run: |
        brew install --formula boost sevenzip
        curl -L https://github.com/nzbgetcom/unrar/releases/download/v7.23/unrar-7.23-macos-universal.tar.gz | sudo tar -xzf - -C /usr/local/bin

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DBUILD_ONLY_TESTS=ON
        cmake --build . --config Release -j 4

    - name: Test
      run: |
        cd build
        ctest -C Release

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-linux-test-log
        path: build/Testing/Temporary/LastTest.log
        retention-days: 5

  tests-openbsd:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: OpenBSD build and test
      uses: cross-platform-actions/action@v1.6.0
      with:
        operating_system: openbsd
        version: '7.9'
        run: |
          sudo pkg_add git cmake libxml boost unrar p7zip
          mkdir build
          cd build
          cmake .. -DBUILD_ONLY_TESTS=ON -DCURSES_INCLUDE_PATH=/usr/include
          cmake --build . --config Release -j 4
          ctest -C Release

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-openbsd-test-log
        path: build/Testing/Temporary/LastTest.log
        retention-days: 5

  tests-freebsd:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: FreeBSD build and test
      uses: cross-platform-actions/action@v0.27.0
      with:
        operating_system: freebsd
        version: '14.2'
        run: |
          sudo pkg install -y git cmake libxml2 boost-all unrar 7-zip
          mkdir build
          cd build
          cmake .. -DBUILD_ONLY_TESTS=ON -DCURSES_INCLUDE_PATH=/usr/include
          cmake --build . --config Release -j 4
          ctest -C Release

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-freebsd-test-log
        path: build/Testing/Temporary/LastTest.log
        retention-days: 5

  cppcheck:
    runs-on: ubuntu-24.04
    steps:

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libxml2-dev libssl-dev libncurses-dev libboost-all-dev cppcheck

    - name: Checkout
      uses: actions/checkout@v6

    - name: cppcheck
      run: |
        mkdir build
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        cppcheck --error-exitcode=1 \
          --project=build/compile_commands.json \
          --enable=warning,performance,portability,information \
          --inline-suppr \
          --check-level=exhaustive \
          --suppress=missingIncludeSystem \
          --suppress=cstyleCast \
          --suppress=dangerousTypeCast \
          --suppress=uninitMemberVar \
          --suppress=uninitMemberVarNoCtor \
          --suppress=unmatchedSuppression \
          --suppress=unknownMacro:tests/ \
          --suppress=preprocessorErrorDirective:build/par2-turbo/ \
          -ilib \
          -itests \
          -ibuild/rapidyenc \
          -ibuild/boost \
          -ibuild/par2-turbo

  build-disabled-parcheck:
    runs-on: ubuntu-24.04
    steps:

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libxml2-dev libssl-dev libncurses-dev libboost-all-dev

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DDISABLE_PARCHECK=yes
        cmake --build . --config Release -j 4

  build-disabled-pch:
    runs-on: ubuntu-24.04
    steps:

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libxml2-dev libssl-dev libncurses-dev libboost-all-dev

    - name: Checkout
      uses: actions/checkout@v6

    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_DISABLE_PRECOMPILE_HEADERS=yes
        cmake --build . --config Release -j 4

  build-openbsd:
    runs-on: ubuntu-24.04
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: OpenBSD build
      uses: cross-platform-actions/action@v1.6.0
      with:
        operating_system: openbsd
        version: '7.9'
        run: |
          sudo pkg_add git cmake libxml boost
          mkdir build
          cd build
          cmake .. -DCURSES_INCLUDE_PATH=/usr/include
          cmake --build . --config Release -j 4

  build-macos-brew-head:
    runs-on: macos-latest
    if: github.ref_name == 'develop'
    steps:

    - name: Build
      run: |
        brew install --formula boost sevenzip
        brew install nzbget --formula --head --verbose
