name: linux build

on:
  workflow_call:
  workflow_dispatch:

env:
  BUILD_ARCHS: "x86_64 aarch64 armhf armel i686 ppc6xx riscv64"
  BUILD_TYPES: ${{ (github.ref_name == 'develop') && 'release debug' || 'release' }}
  BUILD_TESTING: ${{ (github.ref_name != 'main') && 'testing' || '' }}

jobs:
  prepare-build-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      archs: ${{ steps.matrix-vars.outputs.ARCHS }}
      types: ${{ steps.matrix-vars.outputs.TYPES }}
      build_date: ${{ steps.matrix-vars.outputs.BUILD_DATE }}
    steps:

    - name: Calculate matrix variables
      id: matrix-vars
      run: |
        echo ARCHS=[\"$BUILD_ARCHS\"] | sed 's| |","|g' >> "$GITHUB_OUTPUT"
        echo TYPES=[\"$BUILD_TYPES\"] | sed 's| |","|g' >> "$GITHUB_OUTPUT"
        echo "BUILD_DATE=$(date '+%Y%m%d')" >> "$GITHUB_OUTPUT"

  build-bin:
    needs: [prepare-build-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_DATE: ${{ needs.prepare-build-matrix.outputs.build_date }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare-build-matrix.outputs.archs) }}
        type: ${{ fromJSON(needs.prepare-build-matrix.outputs.types) }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Install build prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build curl git

    - name: Restore Musl cross toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: build/toolchains/linux/${{ matrix.arch }}
        key: linux-musl-toolchain-${{ matrix.arch }}-v11.0

    - name: Download Musl cross toolchain on cache miss
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        TOOLCHAIN_URL="https://github.com/nzbgetcom/build-files/releases/download/v11.0"
        ARCHIVE="linux-musl-toolchain-${{ matrix.arch }}.tar.gz"
        mkdir -p build/toolchains/linux
        cd build/toolchains/linux
        curl -fsSL -O "${TOOLCHAIN_URL}/${ARCHIVE}"
        curl -fsSL -O "${TOOLCHAIN_URL}/${ARCHIVE}.sha256"
        sha256sum -c "${ARCHIVE}.sha256"
        tar -xzf "${ARCHIVE}"
        rm -f "${ARCHIVE}" "${ARCHIVE}.sha256"

    - name: Cache unpackers and certificates
      uses: actions/cache@v4
      with:
        path: build/dl
        key: linux-dl-${{ matrix.arch }}-${{ hashFiles('platforms/linux/build.sh') }}

    - name: Cache FetchContent dependencies
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/ci-linux${{ matrix.type == 'debug' && '-debug' || '' }}-${{ matrix.arch }}/deps
        # Exact match only: restore-keys is intentionally omitted to avoid restoring
        # stale compiled binaries when toolchains, flags, or dependency configurations change.
        key: deps-linux-${{ matrix.arch }}-${{ matrix.type }}-${{ hashFiles('cmake/*.cmake', 'CMakeLists.txt', 'CMakePresets.json', 'toolchains/linux/linux-musl.cmake') }}

    - name: Build & Package
      run: |
        bash platforms/linux/build.sh bin ${{ matrix.arch }} ${{ matrix.type }} ${{ env.BUILD_TESTING }}

    - name: Upload full build log on failure
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: nzbget-linux-${{ matrix.arch }}-${{ matrix.type }}-build-log
        path: build/ci-linux*/*.log
        retention-days: 5

    - name: Upload binary artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nzbget-linux-bin-${{ matrix.arch }}-${{ matrix.type }}
        path: build/dist/*.tar.gz
        retention-days: 5

  build-installer:
    needs: [prepare-build-matrix, build-bin]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_DATE: ${{ needs.prepare-build-matrix.outputs.build_date }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Download all binary artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: nzbget-linux-bin-*
        path: artifacts

    - name: Prepare binary archives for installer
      run: |
        mkdir -p build/dist
        find artifacts -name "*.tar.gz" -exec cp {} build/dist/ \;

    - name: Build installer packages
      run: |
        for TYPE in ${{ env.BUILD_TYPES }}; do
          bash platforms/linux/build.sh installer all $TYPE ${{ env.BUILD_TESTING }}
        done

    - name: Rename build artifacts for feature branches
      if: github.ref_name != 'main' && github.ref_name != 'develop'
      run: |
        cd build/dist
        SUFFIX="-${GITHUB_REF_NAME/\//-}-bin-linux"
        for FILE in *.run; do
          [ -f "$FILE" ] || continue
          NEW_FILE=${FILE/-bin-linux/$SUFFIX}
          mv "$FILE" "$NEW_FILE"
        done

    - name: Delete intermediate binary artifacts
      uses: geekyeggo/delete-artifact@v6
      with:
        name: nzbget-linux-bin-*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: nzbget-linux-installers
        path: build/dist/*.run
        retention-days: 5
